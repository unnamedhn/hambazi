<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061a36">
  <title>همبازی - میزبان</title>
  <script type="module" crossorigin src="/hambazi/assets/host-VaJmlQW8.js"></script>
  <link rel="modulepreload" crossorigin href="/hambazi/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/hambazi/assets/host-BprCyME3.css">
</head>
<body>
  <main id="host-display-shell" class="host-display-shell" aria-label="نمایش میزبان همبازی">
    <div id="host-display-frame" class="host-display-frame">
      <iframe
        id="host-runtime-frame"
        name="host-runtime"
        title="بازی میزبان همبازی"
        allow="autoplay"
        scrolling="no"
      ></iframe>
    </div>

    <div id="host-display-loading" class="host-display-loading" role="status" aria-live="polite">
      <span class="host-display-spinner" aria-hidden="true"></span>
      <span class="host-display-loading-label">در حال آماده‌سازی نمایش میزبان...</span>
    </div>

    <button
      id="host-fullscreen-toggle"
      class="host-fullscreen-toggle"
      type="button"
      aria-label="ورود به تمام‌صفحه"
      title="تمام‌صفحه"
    >
      <span aria-hidden="true">⛶</span>
    </button>

    <noscript>
      <div class="host-display-noscript">
        برای اجرای میزبان، JavaScript را در مرورگر فعال کنید.
      </div>
    </noscript>
  </main>

</body>
</html>
